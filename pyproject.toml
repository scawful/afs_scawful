[project]
name = "afs_scawful"
version = "0.0.0"
description = "AFS Scawful plugin package"
requires-python = ">=3.11"
license = {text = "All rights reserved"}
authors = [
  {name = "scawful"}
]

[project.optional-dependencies]
test = [
  "pytest>=7.4"
]
gateway = [
  "aiohttp>=3.10",
  "fastapi>=0.110",
  "uvicorn>=0.30"
]
research = [
  "pypdf>=4.0"
]
claudia = [
  "anthropic>=0.40",
  "google-genai>=1.0",
  "python-dotenv>=1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: cross-component integration coverage",
  "slow: slower training-pipeline or property coverage"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
