# -- Cloud models are deliberately NOT lanes ---------------------------------------------------
# A lane pins weights by sha256, which only means something for models we train and host. Cloud
# models keep their static specs, whose identity is the provider's and which carry provider-specific
# settings (api mode, dated ids) a lane does not express. The app chooses them explicitly; nothing
# here ever substitutes one for a lane above.

# -- Not lanes yet -----------------------------------------------------------------------------
# The Oracle personas (nayru, din, farore, veran, majora) are advertised by the gateway's static
# specs but medical-mechanica does not index those GGUFs, so nothing can serve them. They are left
# out deliberately rather than declared and dead. Adding one means importing it into LM Studio,
# recording its sha256, and adding a lane here.
#
# Assistant lanes (tasks, home) will declare `tools = [...]` alongside `serves`, so a lane can be a
# model plus the tools it is allowed to call.
