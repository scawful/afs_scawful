# Routing manifest: which lane serves which weights, on which box.
#
# A lane is a name clients request. `serves` names the exact weights allowed to answer to it, by
# sha256, because a box relabels models (LM Studio renames `m` to `m@quant` once a second quant of
# it exists) and a name alone does not pin what is behind it.
#
# Requesting a lane whose weights are not present is an error. No lane answers with other weights.
# Promotion is editing `serves` here; it is not a code change and not a deploy.
#
# sha256 values are the first 16 hex characters, enough to identify a file without pasting 64.

version = 1

# -- Scawfulbot lanes (medical-mechanica, RTX 5090, LM Studio on :1234) ------------------------

[[lanes]]
id = "scawfulbot-qwen35"
display_name = "Scawfulbot"
description = "Justin's voice. Promoted 2026-09-16 after the Claude judge eval."
also_answers_to = ["scawfulbot"]
on_unavailable = "error"

  [[lanes.serves]]
  host = "medical-mechanica"
  provider = "lmstudio_win"
  model = "qwen35-curated-masked"
  quant = "q8_0"
  sha256 = "b4490ba25882fe82"

